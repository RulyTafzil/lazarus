<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#242933">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lazarus">
  <title>Lazarus Mail</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <!-- App Container -->
  <div id="app" class="app-root">

    <!-- Top App Bar -->
    <header class="app-header">
      <div class="header-top">
        <button id="btn-menu" class="icon-btn" aria-label="Open folder drawer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="search-input" type="search" placeholder="Search mail (e.g. tag:inbox)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button id="search-clear" class="icon-btn-inline hidden" aria-label="Clear search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <button id="btn-compose-top" class="icon-btn primary-icon-btn" aria-label="Compose message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        </button>
      </div>

      <!-- Filter Chips Row -->
      <nav class="chips-scroll-bar" aria-label="Quick filter chips">
        <button class="chip active" data-query="tag:inbox">Inbox</button>
        <button class="chip" data-query="tag:unread">Unread</button>
        <button class="chip" data-query="tag:flagged">Flagged</button>
        <button class="chip" data-query="tag:sent">Sent</button>
        <button class="chip" data-query="tag:trash">Trash</button>
        <button class="chip" data-query="*">All Mail</button>
      </nav>
    </header>

    <!-- Side Drawer Navigation -->
    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
    <aside id="drawer" class="drawer">
      <div class="drawer-header">
        <div class="drawer-logo">
          <span class="logo-mark">L</span>
          <div class="logo-text">
            <h2>Lazarus</h2>
            <span id="drawer-account-label" class="subtext">Maildir & notmuch</span>
          </div>
        </div>
        <button id="btn-close-drawer" class="icon-btn" aria-label="Close drawer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <nav class="drawer-nav">
        <div class="drawer-section-title">Views</div>
        <button class="drawer-item active" data-query="tag:inbox">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
          <span>Inbox</span>
        </button>
        <button class="drawer-item" data-query="tag:unread">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span>Unread</span>
        </button>
        <button class="drawer-item" data-query="tag:flagged">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span>Flagged</span>
        </button>
        <button class="drawer-item" data-query="tag:sent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          <span>Sent</span>
        </button>
        <button class="drawer-item" data-query="tag:trash">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          <span>Trash</span>
        </button>

        <div class="drawer-section-title">All Tags</div>
        <div id="drawer-tags-list" class="drawer-tags-list">
          <div class="empty-hint">Loading tags…</div>
        </div>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="content-container">

      <!-- View 1: Thread List -->
      <section id="view-list" class="view-panel active-view">
        <div id="thread-list-status" class="list-status hidden"></div>
        <div id="thread-list" class="thread-list">
          <div class="loading-spinner-wrap">
            <div class="spinner"></div>
            <span>Loading threads…</span>
          </div>
        </div>
        <div id="load-more-wrap" class="load-more-wrap hidden">
          <button id="btn-load-more" class="btn secondary-btn">Load more</button>
        </div>
      </section>

      <!-- View 2: Thread Detail -->
      <section id="view-detail" class="view-panel hidden-view">
        <div class="detail-header-bar">
          <button id="btn-detail-back" class="icon-btn back-btn" aria-label="Back to threads">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span class="back-text">Back</span>
          </button>
          <div class="detail-actions">
            <button id="btn-detail-archive" class="icon-btn" aria-label="Archive thread" title="Archive">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
            </button>
            <button id="btn-detail-trash" class="icon-btn" aria-label="Trash thread" title="Trash">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            <button id="btn-detail-tag" class="icon-btn" aria-label="Edit tags" title="Edit tags">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
            </button>
            <button id="btn-detail-star" class="icon-btn" aria-label="Toggle flag" title="Flag">
              <svg class="star-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </button>
          </div>
        </div>

        <div class="detail-body">
          <div class="thread-subject-wrap">
            <h1 id="detail-subject" class="thread-subject-title">…</h1>
            <div id="detail-tags-row" class="detail-tags-row"></div>
          </div>
          <div id="detail-messages-list" class="detail-messages-list"></div>
        </div>

        <!-- Sticky Detail Bottom Actions -->
        <footer class="detail-bottom-bar">
          <button id="btn-detail-reply" class="btn primary-btn reply-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"></polyline><path d="M20 18v-2a4 4 0 0 0-4-4H4"></path></svg>
            <span>Reply</span>
          </button>
          <button id="btn-detail-reply-all" class="btn secondary-btn reply-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7 17 2 12 7 7"></polyline><polyline points="12 17 7 12 12 7"></polyline><path d="M22 18v-2a4 4 0 0 0-4-4H7"></path></svg>
            <span>Reply All</span>
          </button>
        </footer>
      </section>

    </main>

    <!-- Reply / Compose Bottom Sheet -->
    <div id="compose-backdrop" class="modal-backdrop hidden"></div>
    <section id="compose-sheet" class="bottom-sheet compose-sheet hidden">
      <div class="sheet-header">
        <button id="btn-compose-close" class="icon-btn" aria-label="Close compose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 id="compose-sheet-title" class="sheet-title">New message</h3>
        <button id="btn-compose-send" class="btn primary-btn send-btn">
          <span class="send-text">Send</span>
          <div class="send-spinner spinner hidden"></div>
        </button>
      </div>

      <form id="compose-form" class="compose-form">
        <!-- Account Row -->
        <div id="compose-account-row" class="field-row hidden">
          <label for="compose-account-select" class="field-label">From</label>
          <select id="compose-account-select" class="field-input"></select>
        </div>

        <!-- To Row with Autocomplete -->
        <div class="field-row autocomplete-container">
          <label for="compose-to" class="field-label">To</label>
          <input id="compose-to" type="text" class="field-input" placeholder="recipient@example.com" autocomplete="off">
          <button type="button" id="btn-toggle-cc" class="subtle-btn">Cc/Bcc</button>
          <div id="to-autocomplete-dropdown" class="autocomplete-dropdown hidden"></div>
        </div>

        <!-- Optional Cc / Bcc Row -->
        <div id="compose-cc-row" class="field-row hidden">
          <label for="compose-cc" class="field-label">Cc</label>
          <input id="compose-cc" type="text" class="field-input" placeholder="cc@example.com" autocomplete="off">
        </div>
        <div id="compose-bcc-row" class="field-row hidden">
          <label for="compose-bcc" class="field-label">Bcc</label>
          <input id="compose-bcc" type="text" class="field-input" placeholder="bcc@example.com" autocomplete="off">
        </div>

        <!-- Subject Row -->
        <div class="field-row">
          <label for="compose-subject" class="field-label">Subject</label>
          <input id="compose-subject" type="text" class="field-input" placeholder="Subject">
        </div>

        <!-- Plaintext Message Body -->
        <div class="body-row">
          <textarea id="compose-body" class="compose-textarea" placeholder="Compose email…" rows="8"></textarea>
        </div>

        <!-- Attachments List & Upload -->
        <div class="attachments-section">
          <div class="attachments-header">
            <label class="attachment-upload-btn" for="compose-file-input">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
              <span>Attach file</span>
            </label>
            <input id="compose-file-input" type="file" multiple class="hidden-file-input">
          </div>
          <div id="compose-attachments-list" class="compose-attachments-chips"></div>
        </div>

        <!-- Hidden In-Reply-To / References -->
        <input type="hidden" id="compose-in-reply-to" value="">
        <input type="hidden" id="compose-references" value="">
      </form>
    </section>

    <!-- Tag Management Modal Sheet -->
    <div id="tag-modal-backdrop" class="modal-backdrop hidden"></div>
    <section id="tag-modal" class="bottom-sheet tag-modal hidden">
      <div class="sheet-header">
        <h3 class="sheet-title">Edit tags</h3>
        <button id="btn-tag-modal-done" class="btn primary-btn">Done</button>
      </div>
      <div class="tag-modal-body">
        <div class="tag-add-box">
          <input id="tag-new-input" type="text" placeholder="Add custom tag…" class="tag-new-input">
          <button id="btn-add-custom-tag" class="btn secondary-btn">Add</button>
        </div>
        <div id="tag-modal-list" class="tag-modal-list">
          <div class="loading-spinner-wrap">
            <div class="spinner"></div>
            <span>Loading tags…</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Toast Notification Banner -->
    <div id="toast" class="toast hidden">
      <span id="toast-message" class="toast-message"></span>
      <button id="toast-undo" class="toast-undo-btn hidden">Undo</button>
    </div>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
